# 欢迎使用 MD Reader

这是一个 **Markdown 在线阅读器**，支持：

- ✅ 实时预览
- ✅ 打开 .md 文件
- ✅ 导出 HTML
- ✅ 分屏查看

## 功能特性

1. **实时预览** - 左侧编辑，右侧即时查看效果
2. **文件操作** - 打开、保存 Markdown 文件
3. **导出功能** - 将 Markdown 导出为 HTML 文件
4. **主题切换** - 支持亮色/暗色主题

            <div class="preview-panel" id="preview-panel">
                <div class="panel-header">
                    <span>👁️ 实时预览</span>
                    <div class="panel-actions">
                        <button id="btn-snapshot" class="btn btn-small" title="快照下载">📸</button>
